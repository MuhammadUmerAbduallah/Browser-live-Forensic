<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 260px; margin: 0; font-family: system-ui, Segoe UI, Arial; background: #0e1116; color: #e6edf3; }
    .hd { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #272e38; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #4ec9b0; }
    .dot.off { background: #f0584b; }
    h3 { margin: 0; font-size: 13px; letter-spacing: 1px; }
    .body { padding: 12px 14px; }
    .status { font-size: 12px; color: #8b949e; margin-bottom: 10px; }
    .row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px solid #1b212b; }
    .row b { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .counts { margin-bottom: 10px; }
    .counts h4 { margin: 0 0 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="hd"><span class="dot" id="dot"></span><h3>BROWSER FORENSICS</h3></div>
  <div class="body">
    <div class="status" id="status">Checking local listener…</div>
    <div class="counts">
      <h4>This browser session</h4>
      <div class="row"><span>Delivered</span><b id="delivered">0</b></div>
      <div class="row"><span>Rejected by listener</span><b id="rejected">0</b></div>
      <div class="row"><span>No response</span><b id="unavailable">0</b></div>
      <div class="row"><span>Repeat requests skipped</span><b id="suppressed">0</b></div>
    </div>
    <div id="rows" aria-label="Delivered events by type"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
